services:
  app:
    build: .
    restart: unless-stopped
    environment:
      SERVER_PORT: "3000"
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: postgres://postgres:postgres@postgres:5432/cinema
      GOOSE_MIGRATION_DIR: ./migrations
      GOOSE_TABLE: goose_db_version
      VALKEY_HOST: valkey-server
      VALKEY_PORT: "6379"
    # ports: ["3000:3000"]   # only for local `docker compose up`; vps-manager proxies via nginx
    depends_on:
      postgres:
        condition: service_healthy
      valkey-server:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  migrate:
    image: ghcr.io/pressly/goose:latest
    restart: "no"
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: postgres://postgres:postgres@postgres:5432/cinema
      GOOSE_TABLE: goose_db_version
    command: ["-dir", "/migrations", "up"]
    volumes:
      - ./internals/postgres/migrations:/migrations
    depends_on:
      postgres:
        condition: service_healthy

  valkey-server:   # service name kept — app's VALKEY_HOST uses it
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command: ["valkey-server", "--save", "60 1", "--loglevel", "warning"]
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cinema
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cinema"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  valkey_data:
  postgres_data:
  
